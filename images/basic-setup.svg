<svg width="100%" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The basic setup: pump laser, crystal, light-shaping devices, and detectors</title>
<desc>A left-to-right schematic. A pump laser beam enters a crystal, where a photon pair is born and splits into two paths. Each path passes through a light-shaping device, then ends at a detector.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#5a6296" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="400" rx="18" fill="#0f1220"/>
<text x="380" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e7e9f5">The basic setup</text>
<text x="380" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9aa0c3">one photon pair, two shaped and measured</text>

<!-- pump laser -->
<rect x="40" y="165" width="110" height="50" rx="10" fill="#171b30" stroke="#3d3a86" stroke-width="1"/>
<circle cx="63" cy="190" r="7" fill="#8b7bf0"/>
<text x="105" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#e7e9f5">Pump laser</text>

<!-- pump beam to crystal -->
<line x1="150" y1="190" x2="234" y2="190" stroke="#8b7bf0" stroke-width="3" marker-end="url(#arrow)"/>

<!-- crystal -->
<rect x="238" y="164" width="52" height="52" rx="8" transform="rotate(45 264 190)" fill="#171b30" stroke="#8b7bf0" stroke-width="1.6"/>
<text x="264" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e7e9f5">Crystal</text>
<text x="264" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa0c3">a photon pair is born here</text>

<!-- two diverging photon paths (warm color = the down-converted pair) -->
<path d="M 288 178 C 340 140, 360 110, 400 100" fill="none" stroke="#f0725a" stroke-width="3"/>
<path d="M 288 202 C 340 240, 360 270, 400 280" fill="none" stroke="#f0725a" stroke-width="3"/>

<!-- upper path: shaping device -> detector -->
<rect x="404" y="76" width="140" height="50" rx="10" fill="#171b30" stroke="#f0725a" stroke-width="1"/>
<text x="474" y="97" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e7e9f5">Light-shaping</text>
<text x="474" y="113" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e7e9f5">device</text>
<line x1="544" y1="101" x2="600" y2="101" stroke="#f0725a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="604" y="76" width="112" height="50" rx="10" fill="#171b30" stroke="#5ad1c8" stroke-width="1"/>
<text x="660" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#e7e9f5">Detector</text>

<!-- lower path: shaping device -> detector -->
<rect x="404" y="256" width="140" height="50" rx="10" fill="#171b30" stroke="#f0725a" stroke-width="1"/>
<text x="474" y="277" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e7e9f5">Light-shaping</text>
<text x="474" y="293" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e7e9f5">device</text>
<line x1="544" y1="281" x2="600" y2="281" stroke="#f0725a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="604" y="256" width="112" height="50" rx="10" fill="#171b30" stroke="#5ad1c8" stroke-width="1"/>
<text x="660" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#e7e9f5">Detector</text>

<!-- annotation pointing at the shaping devices -->
<text x="474" y="343" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#9aa0c3">this is where a photon becomes a qudit</text>
<path d="M 474 328 L 474 152" fill="none" stroke="#3d3a86" stroke-width="1" stroke-dasharray="3,4"/>
<path d="M 474 328 L 474 232" fill="none" stroke="#3d3a86" stroke-width="1" stroke-dasharray="3,4"/>

<text x="380" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa0c3">violet = the pump beam that starts things off  ·  warm = the entangled pair it creates</text>
</svg>
