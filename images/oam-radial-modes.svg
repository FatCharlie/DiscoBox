<svg width="100%" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Orbital twist and radial structure of the light modes used in this project</title>
<desc>Two rows of small circular mode patterns. Top row shows increasing orbital angular momentum: a growing dark core and color that cycles more times around the ring, from no twist to a triple twist. Bottom row shows increasing radial index: the same single-color ring splitting into two, then three, then four concentric rings.</desc>
