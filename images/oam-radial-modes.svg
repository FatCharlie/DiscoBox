<text x="360.0" y="40.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#e7e9f5" font-weight="600">Two knobs, one photon</text>
<text x="360.0" y="62.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9aa0c3" font-weight="400">the extra structure this project packs into a single particle of light</text>
